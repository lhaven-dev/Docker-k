apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world-configured
  namespace: tp-docker-k8s
  labels:
    app: hello-world-configured
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-world-configured
  template:
    metadata:
      labels:
        app: hello-world-configured
    spec:
      containers:
        - name: hello-world
          image: hello-world-tp:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: hello-world-config
                  key: APP_NAME
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: hello-world-config
                  key: ENVIRONMENT
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: hello-world-config
                  key: PORT
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hello-world-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hello-world-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: data-volume
              mountPath: /data
            - name: config-volume
              mountPath: /etc/app-config
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: hello-world-data
        - name: config-volume
          configMap:
            name: hello-world-config
